<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1.0'/><title>联系记录</title><link rel='stylesheet' href='/theme.css'/></head><body><div class='banner'>联系记录统计</div><h1>联系记录</h1><p><a href='/dashboard'>返回首页</a></p><div id='bars'></div><table><thead><tr><th>ID</th><th>服务方</th><th>能力</th><th>联系类型</th><th>来源</th><th>时间</th></tr></thead><tbody id='rows'></tbody></table><script>const t=localStorage.getItem('token');if(!t)location.href='/admin';Promise.all([fetch('/api/admin/contact-log/stat',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()),fetch('/api/admin/contact-log/list',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json())]).then(([s,l])=>{const stat=s.data||{};bars.innerHTML=Object.keys(stat).map(k=>`<p>服务方 ${k}: <span style='display:inline-block;background:#4caf50;height:10px;width:${stat[k]*20}px'></span> ${stat[k]}</p>`).join('');rows.innerHTML=(l.data||[]).map(x=>`<tr><td>${x.id}</td><td>${x.providerId}</td><td>${x.abilityId}</td><td>${x.contactType}</td><td>${x.sourcePage}</td><td>${x.createTime}</td></tr>`).join('');});</script></body></html>
