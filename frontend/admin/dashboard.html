<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台首页</title>
  </head>
  <body>
    <h1>后台首页（最小版）</h1>
    <p id="user"></p>
    <h3>统计</h3>
    <pre id="stats"></pre>
    <h3>当前角色菜单（按接口返回渲染）</h3>
    <ul id="menus"></ul>
    <button id="logout">退出登录</button>

    <script>
      const token = localStorage.getItem('token');
      const stats = document.getElementById('stats');
      if (!token) {
        location.href = '/admin';
      }

      async function loadCurrentUser() {
        const res = await fetch('/api/auth/current-user', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();

        if (!res.ok) {
          localStorage.removeItem('token');
          location.href = '/admin';
          return;
        }

        document.getElementById('user').textContent = `用户：${data.username}（${data.role}）`;
        const ul = document.getElementById('menus');
        ul.innerHTML = '';
        data.menus.forEach((m) => {
          const li = document.createElement('li');
          li.innerHTML = `<a href=\"${m.path}\">${m.name}</a> (${m.path})`;
          ul.appendChild(li);
        });
      }

      async function loadStats() {
        const res = await fetch('/api/system/dashboard-stats', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();
        if (!res.ok) {
          stats.textContent = data.detail || '统计加载失败';
          return;
        }
        stats.textContent = JSON.stringify(data, null, 2);
      }

      document.getElementById('logout').addEventListener('click', async () => {
        await fetch('/api/auth/logout', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
        });
        localStorage.removeItem('token');
        location.href = '/admin';
      });

      loadCurrentUser();
      loadStats();
    </script>
  </body>
</html>
