<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1.0'/><title>后台首页</title><link rel='stylesheet' href='/theme.css'/></head><body><div class='banner'>运营总览</div><h1>后台首页</h1><p id='user'></p><div id='cards' style='display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:12px'></div><h3>菜单</h3><ul id='menus'></ul><button id='logout'>退出登录</button><script>const token=localStorage.getItem('token');if(!token)location.href='/admin';async function init(){const u=await fetch('/api/auth/current-user',{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());if(!u.username){location.href='/admin';return;}user.textContent=`用户：${u.username}（${u.role}）`;menus.innerHTML=(u.menus||[]).map(m=>`<li><a href='${m.path}'>${m.name}</a></li>`).join('');const s=await fetch('/api/system/dashboard-stats',{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());const d=s.data||{};cards.innerHTML=Object.keys(d).map(k=>`<div class='card'><b>${k}</b><div style='font-size:28px;color:#2f7d32'>${d[k]}</div></div>`).join('');}logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',headers:{Authorization:`Bearer ${token}`}});localStorage.removeItem('token');location.href='/admin'};init();</script></body></html>
