<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>需求管理</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>农户需求管理</div><h1>农户需求管理</h1><p><a href='/dashboard'>返回首页</a></p><p id='msg'></p><table><thead><tr><th>ID</th><th>服务类型</th><th>联系人</th><th>电话</th><th>地址</th><th>数量</th><th>状态</th><th>时间</th></tr></thead><tbody id='rows'></tbody></table><script>const t=localStorage.getItem('token');if(!t)location.href='/admin';fetch('/api/admin/demand/list',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{if(!ok){msg.textContent=d.detail||'加载失败';return;}rows.innerHTML=(d.data||[]).map(x=>`<tr><td>${x.id}</td><td>${x.serviceType}</td><td>${x.contactName}</td><td>${x.contactPhone}</td><td>${x.serviceAddress}</td><td>${x.quantity}${x.unit||''}</td><td>${x.status}</td><td>${x.createTime||''}</td></tr>`).join('');msg.textContent=`共 ${d.data.length} 条`;});</script></body></html>
