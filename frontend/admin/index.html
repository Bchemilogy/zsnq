<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台登录</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans',
          'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #e0f2fe 100%);
      }
      .card {
        width: min(92vw, 420px);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        padding: 28px 24px;
      }
      .title {
        margin: 0 0 8px;
        font-size: 24px;
        color: #0f172a;
      }
      .sub {
        margin: 0 0 22px;
        color: #64748b;
        font-size: 14px;
      }
      .form-item {
        margin-bottom: 14px;
      }
      .label {
        display: block;
        margin-bottom: 6px;
        color: #334155;
        font-size: 14px;
      }
      .input {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 11px 12px;
        font-size: 14px;
        outline: none;
      }
      .input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }
      .btn {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px;
        font-size: 15px;
        color: #fff;
        background: linear-gradient(90deg, #2563eb, #0ea5e9);
        cursor: pointer;
      }
      .btn:hover {
        filter: brightness(1.04);
      }
      .tips {
        margin: 14px 0 0;
        font-size: 13px;
        color: #64748b;
      }
      #msg {
        min-height: 20px;
        margin-top: 10px;
        font-size: 13px;
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="title">智枢农擎 · 后台登录</h1>
      <p class="sub">第一阶段测试版后台入口</p>
      <form id="login-form">
        <div class="form-item">
          <label class="label" for="username">账号</label>
          <input class="input" id="username" value="admin" />
        </div>
        <div class="form-item">
          <label class="label" for="password">密码</label>
          <input class="input" id="password" type="password" value="admin123" />
        </div>
        <button class="btn" type="submit">登录后台</button>
      </form>
      <p id="msg"></p>
      <p class="tips">默认测试账号：admin / admin123</p>
    </div>

    <script>
      const form = document.getElementById('login-form');
      const msg = document.getElementById('msg');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '登录中...';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, client_type: 'PC' }),
        });

        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.detail || '登录失败';
          return;
        }

        localStorage.setItem('token', data.token);
        location.href = '/dashboard';
      });
    </script>
  </body>
</html>
