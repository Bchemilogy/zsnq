<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>登录日志</title><link rel='stylesheet' href='/theme.css'/>
<style>body{font-family:Arial,'Microsoft YaHei';background:#f8fafc;margin:0}.wrap{max-width:980px;margin:20px auto;padding:0 12px}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.08)}table{width:100%;border-collapse:collapse}th,td{border:1px solid #e2e8f0;padding:8px}th{background:#f1f5f9}</style></head>
<body><div class="banner">农服数字平台</div><div class="wrap"><div class="card"><h1>登录日志</h1><p><a href="/dashboard">返回首页</a></p><p id="msg"></p><pre id="summary"></pre><table><thead><tr><th>用户名</th><th>角色</th><th>客户端</th><th>登录时间</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
const token=localStorage.getItem('token');if(!token)location.href='/admin';
(async()=>{const s=await fetch('/api/system/login-log-summary',{headers:{Authorization:`Bearer ${token}`}});const sd=await s.json();if(s.ok)document.getElementById('summary').textContent=`总登录次数：${sd.total}，按端统计：${JSON.stringify(sd.byClientType)}`;const r=await fetch('/api/system/login-log',{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(r.status===401){localStorage.removeItem('token');location.href='/admin';return;}if(r.status===403){document.getElementById('msg').textContent='当前账号无权限查看登录日志';return;}document.getElementById('msg').textContent=`共 ${d.items.length} 条`;const rows=document.getElementById('rows');rows.innerHTML='';d.items.forEach(item=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${item.username}</td><td>${item.role}</td><td>${item.client_type}</td><td>${item.login_at}</td>`;rows.appendChild(tr);});})();
</script></body></html>
