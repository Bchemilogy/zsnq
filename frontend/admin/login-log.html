<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1.0'/><title>登录日志</title><link rel='stylesheet' href='/theme.css'/></head><body><div class='banner'>登录日志</div><h1>登录日志</h1><p><a href='/dashboard'>返回首页</a></p><div id='chart'></div><table><thead><tr><th>用户名</th><th>角色</th><th>客户端</th><th>时间</th></tr></thead><tbody id='rows'></tbody></table><script>const t=localStorage.getItem('token');if(!t)location.href='/admin';Promise.all([fetch('/api/system/login-log-summary',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()),fetch('/api/system/login-log',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json())]).then(([s,l])=>{const m=s.byClientType||{};chart.innerHTML=`<p>总登录次数：<b>${s.total||0}</b></p>`+Object.keys(m).map(k=>`<p>${k}: <span style='display:inline-block;background:#3b82f6;height:10px;width:${m[k]*20}px'></span> ${m[k]}</p>`).join('');rows.innerHTML=(l.items||[]).map(x=>`<tr><td>${x.username}</td><td>${x.role}</td><td>${x.client_type}</td><td>${x.login_at}</td></tr>`).join('');});</script></body></html>
