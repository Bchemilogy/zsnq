<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录日志</title>
  </head>
  <body>
    <h1>登录日志（最小版）</h1>
    <p><a href="/dashboard">返回首页</a></p>
    <p id="msg"></p>
    <pre id="summary"></pre>
    <table border="1" cellpadding="6">
      <thead>
        <tr>
          <th>用户名</th>
          <th>角色</th>
          <th>客户端</th>
          <th>登录时间</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <script>
      const token = localStorage.getItem('token');
      const msg = document.getElementById('msg');
      const summary = document.getElementById('summary');
      const rows = document.getElementById('rows');

      if (!token) {
        location.href = '/admin';
      }

      async function loadLogs() {
        const summaryRes = await fetch('/api/system/login-log-summary', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const summaryData = await summaryRes.json();
        if (summaryRes.ok) {
          summary.textContent = `总登录次数：${summaryData.total}，按端统计：${JSON.stringify(summaryData.byClientType)}`;
        }

        const res = await fetch('/api/system/login-log', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();

        if (res.status === 401) {
          localStorage.removeItem('token');
          location.href = '/admin';
          return;
        }

        if (res.status === 403) {
          msg.textContent = '当前账号无权限查看登录日志';
          return;
        }

        msg.textContent = `共 ${data.items.length} 条`;
        rows.innerHTML = '';
        data.items.forEach((item) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.username}</td>
            <td>${item.role}</td>
            <td>${item.client_type}</td>
            <td>${item.login_at}</td>
          `;
          rows.appendChild(tr);
        });
      }

      loadLogs();
    </script>
  </body>
</html>
