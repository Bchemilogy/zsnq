<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>服务方审核</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>服务方入驻审核</div><h1>服务方入驻审核</h1><p><a href='/dashboard'>返回首页</a></p><p id='msg'></p><table><thead><tr><th>申请ID</th><th>名称</th><th>联系人</th><th>电话</th><th>状态</th><th>操作</th></tr></thead><tbody id='rows'></tbody></table><div id='detail' class='card'></div><script>const t=localStorage.getItem('token');if(!t)location.href='/admin';let role='';const stypeMap={AGRICULTURAL_MACHINERY:'农机服务',SEEDLING:'育秧服务',DRYING:'烘干服务',STORAGE:'仓储服务',PLANTING_GUIDANCE:'种植指导',OTHER:'其他'};async function current(){const r=await fetch('/api/auth/current-user',{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();role=d.role||'';}async function viewDetail(id){const r=await fetch(`/api/admin/provider/apply/detail?applyId=${id}`,{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();const a=d.data.apply||{};const logs=d.data.auditLogs||[];const files=a.attachments||[];detail.innerHTML=`<h3>申请信息</h3><p>服务方：${a.providerName||''}</p><p>联系人：${a.contactName||''} ${a.contactPhone||''}</p><p>地址：${a.address||''}</p><p>服务类型：${(a.serviceTypes||[]).map(x=>stypeMap[x]||x).join('、')}</p><h3>上传附件</h3><ul>${files.map(f=>`<li><a target='_blank' href='${f.fileUrl}'>${f.fileName||f.fileType}</a></li>`).join('')||'<li>无</li>'}</ul><h3>审核日志</h3><ul>${logs.map(x=>`<li>${x.createTime||''} ${x.action||''} ${x.remark||''}</li>`).join('')||'<li>无</li>'}</ul>`;}async function approve(id){const auditRemark=prompt('审核备注(可空)','')||'';const r=await fetch('/api/admin/provider/apply/approve',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({applyId:id,auditRemark})});const d=await r.json();alert(d.message||d.detail);load();}async function rejectApply(id){const rejectReason=prompt('驳回原因(必填)','资料不完整')||'';if(!rejectReason.trim())return;const r=await fetch('/api/admin/provider/apply/reject',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({applyId:id,rejectReason})});const d=await r.json();alert(d.message||d.detail);load();}window.viewDetail=viewDetail;window.approve=approve;window.rejectApply=rejectApply;async function load(){const r=await fetch('/api/admin/provider/apply/list',{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();const canAudit=['ADMIN','OPERATOR'].includes(role);rows.innerHTML=(d.data||[]).map(x=>`<tr><td>${x.applyId}</td><td>${x.providerName}</td><td>${x.contactName}</td><td>${x.contactPhone}</td><td>${x.auditStatus}</td><td><button onclick='viewDetail(${x.applyId})'>详情</button>${canAudit?` <button onclick='approve(${x.applyId})'>通过</button> <button onclick='rejectApply(${x.applyId})'>驳回</button>`:''}</td></tr>`).join('');msg.textContent=`共 ${d.data.length} 条`;}
(async()=>{await current();await load();})();</script></body></html>
