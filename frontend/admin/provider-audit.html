<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>服务方审核</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>服务方入驻审核</div><h1>服务方入驻审核</h1><p><a href='/dashboard'>返回首页</a></p><p id='msg'></p><table><thead><tr><th>申请ID</th><th>名称</th><th>联系人</th><th>电话</th><th>状态</th><th>操作</th></tr></thead><tbody id='rows'></tbody></table><div id='detail' class='card'></div><script>const t=localStorage.getItem('token');if(!t)location.href='/admin';function viewDetail(id){fetch(`/api/admin/provider/apply/detail?applyId=${id}`,{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(d=>{const a=d.data.apply||{};const logs=d.data.auditLogs||[];const files=a.attachments||[];detail.innerHTML=`<h3>申请信息</h3><p>服务方：${a.providerName||''}</p><p>联系人：${a.contactName||''} ${a.contactPhone||''}</p><p>地址：${a.address||''}</p><p>服务类型：${(a.serviceTypes||[]).join('、')}</p><h3>上传附件</h3><ul>${files.map(f=>`<li><a target='_blank' href='${f.fileUrl}'>${f.fileName||f.fileType}</a></li>`).join('')||'<li>无</li>'}</ul><h3>审核日志</h3><ul>${logs.map(x=>`<li>${x.createTime||''} ${x.action||''} ${x.remark||''}</li>`).join('')||'<li>无</li>'}</ul>`;});}window.viewDetail=viewDetail;fetch('/api/admin/provider/apply/list',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(d=>{rows.innerHTML=(d.data||[]).map(x=>`<tr><td>${x.applyId}</td><td>${x.providerName}</td><td>${x.contactName}</td><td>${x.contactPhone}</td><td>${x.auditStatus}</td><td><button onclick='viewDetail(${x.applyId})'>查看详情</button></td></tr>`).join('');msg.textContent=`共 ${d.data.length} 条`;});</script></body></html>
