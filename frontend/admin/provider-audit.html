<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>服务方入驻审核</title>
  </head>
  <body>
    <h1>服务方入驻审核</h1>
    <p><a href="/dashboard">返回首页</a></p>
    <p id="msg"></p>
    <table border="1" cellpadding="6">
      <thead>
        <tr>
          <th>申请ID</th>
          <th>服务方名称</th>
          <th>联系人</th>
          <th>电话</th>
          <th>状态</th>
          <th>提交时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <script>
      const token = localStorage.getItem('token');
      if (!token) location.href = '/admin';

      async function loadList() {
        const res = await fetch('/api/admin/provider/apply/list', { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('msg').textContent = data.detail || '加载失败';
          return;
        }
        const items = data.data || [];
        document.getElementById('msg').textContent = `共 ${items.length} 条`;
        const rows = document.getElementById('rows');
        rows.innerHTML = '';
        items.forEach((item) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.applyId}</td>
            <td>${item.providerName}</td>
            <td>${item.contactName}</td>
            <td>${item.contactPhone}</td>
            <td>${item.auditStatus}</td>
            <td>${item.createTime || ''}</td>
            <td>
              <button onclick="viewDetail(${item.applyId})">查看详情</button>
              <button onclick="approve(${item.applyId})">通过</button>
              <button onclick="rejectApply(${item.applyId})">驳回</button>
            </td>
          `;
          rows.appendChild(tr);
        });
      }

      async function viewDetail(applyId) {
        const res = await fetch(`/api/admin/provider/apply/detail?applyId=${applyId}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();
        alert(JSON.stringify(data, null, 2));
      }

      async function approve(applyId) {
        const remark = prompt('审核备注（可空）') || '';
        const res = await fetch('/api/admin/provider/apply/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ applyId, auditRemark: remark }),
        });
        const data = await res.json();
        alert(data.message || data.detail);
        loadList();
      }

      async function rejectApply(applyId) {
        const reason = prompt('请输入驳回原因（必填）') || '';
        if (!reason.trim()) {
          alert('驳回原因不能为空');
          return;
        }
        const res = await fetch('/api/admin/provider/apply/reject', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ applyId, rejectReason: reason }),
        });
        const data = await res.json();
        alert(data.message || data.detail);
        loadList();
      }

      window.viewDetail = viewDetail;
      window.approve = approve;
      window.rejectApply = rejectApply;
      loadList();
    </script>
  </body>
</html>
