<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>角色管理</title><link rel='stylesheet' href='/theme.css'/>
<style>body{font-family:Arial,'Microsoft YaHei';background:#f8fafc;margin:0}.wrap{max-width:900px;margin:20px auto;padding:0 12px}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.08)}table{width:100%;border-collapse:collapse}th,td{border:1px solid #e2e8f0;padding:8px}th{background:#f1f5f9}input{padding:7px;border:1px solid #cbd5e1;border-radius:6px}button{padding:7px 10px;border:0;border-radius:6px;color:#fff;background:#2563eb;cursor:pointer}.danger{background:#dc2626}</style>
</head><body><div class="banner">农服数字平台</div><div class="wrap"><div class="card"><h1>角色管理</h1><p><a href="/dashboard">返回首页</a></p><p id="msg"></p>
<div><input id="code" placeholder="角色编码"/><input id="name" placeholder="角色名称"/><button id="add">新增角色</button></div><br/>
<table><thead><tr><th>角色编码</th><th>角色名称</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
const token=localStorage.getItem('token');if(!token)location.href='/admin';const msg=document.getElementById('msg');
async function load(){const r=await fetch('/api/system/role',{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'加载失败';return;}const rows=document.getElementById('rows');rows.innerHTML='';d.items.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${x.code}</td><td>${x.name}</td><td><button onclick="editRole('${x.code}','${x.name}')">改</button> <button class='danger' onclick="delRole('${x.code}')">删</button></td>`;rows.appendChild(tr);});}
async function add(){const r=await fetch('/api/system/role',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({code:code.value,name:name.value})});const d=await r.json();msg.textContent=r.ok?d.message:d.detail;load();}
async function editRole(c,n){const nn=prompt('新角色名称',n);if(nn===null)return;const r=await fetch(`/api/system/role/${c}`,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({code:c,name:nn})});const d=await r.json();msg.textContent=r.ok?d.message:d.detail;load();}
async function delRole(c){if(!confirm(`确认删除 ${c} ?`))return;const r=await fetch(`/api/system/role/${c}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});const d=await r.json();msg.textContent=r.ok?d.message:d.detail;load();}
window.editRole=editRole;window.delRole=delRole;document.getElementById('add').addEventListener('click',add);load();
</script></body></html>
