<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1.0'/><title>服务能力管理</title><link rel='stylesheet' href='/theme.css'/></head><body><div class='banner'>服务能力管理</div><h1>服务能力管理</h1><p><a href='/dashboard'>返回首页</a></p><p id='msg'></p><table><thead><tr><th>能力ID</th><th>服务方ID</th><th>类型</th><th>名称</th><th>区域</th><th>状态</th></tr></thead><tbody id='rows'></tbody></table><script>const t=localStorage.getItem('token');if(!t)location.href='/admin';fetch('/api/admin/service-ability/list',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{if(!ok){msg.textContent=d.detail;return;}rows.innerHTML=(d.data||[]).map(x=>`<tr><td>${x.id}</td><td>${x.providerId}</td><td>${x.serviceType}</td><td>${x.abilityName}</td><td>${x.serviceArea||''}</td><td>${x.status}</td></tr>`).join('');});</script></body></html>
