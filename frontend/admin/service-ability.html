<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1.0'/><title>服务能力管理</title><link rel='stylesheet' href='/theme.css'/></head><body><div class="banner">农服数字平台</div><h1>服务能力管理</h1><p><a href='/dashboard'>返回首页</a></p><p id='msg'></p><pre id='list'></pre><script>
const t=localStorage.getItem('token');if(!t)location.href='/admin';(async()=>{const r=await fetch('/api/admin/service-ability/list',{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();if(!r.ok){msg.textContent=d.detail;return;}list.textContent=JSON.stringify(d.data,null,2);})();
</script></body></html>
