<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>服务记录管理</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>服务记录管理</div><h1>服务记录管理</h1><p><a href='/dashboard'>返回首页</a></p><p id='msg'></p><table><thead><tr><th>记录ID</th><th>需求ID</th><th>服务类型</th><th>处理量</th><th>开始</th><th>结束</th><th>凭证链</th></tr></thead><tbody id='rows'></tbody></table><pre id='chain'></pre><script>const t=localStorage.getItem('token');if(!t)location.href='/admin';function view(id){fetch(`/api/admin/evidence-chain/detail?recordId=${id}`,{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(d=>chain.textContent=JSON.stringify(d.data,null,2));}window.view=view;fetch('/api/admin/service-record/list',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{if(!ok){msg.textContent=d.detail||'加载失败';return;}rows.innerHTML=(d.data||[]).map(x=>`<tr><td>${x.id}</td><td>${x.demandId}</td><td>${x.serviceType}</td><td>${x.processQuantity}${x.unit||''}</td><td>${x.startTime||''}</td><td>${x.endTime||''}</td><td><button onclick='view(${x.id})'>查看证据链</button></td></tr>`).join('');msg.textContent=`共 ${d.data.length} 条`;});</script></body></html>
