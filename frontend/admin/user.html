<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>用户管理</title><link rel='stylesheet' href='/theme.css'/>
<style>body{font-family:Arial,'Microsoft YaHei';background:#f8fafc;margin:0}.wrap{max-width:980px;margin:20px auto;padding:0 12px}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.08)}table{width:100%;border-collapse:collapse}th,td{border:1px solid #e2e8f0;padding:8px}th{background:#f1f5f9}input,select{padding:7px;border:1px solid #cbd5e1;border-radius:6px}button{padding:7px 10px;border:0;border-radius:6px;color:#fff;background:#2563eb;cursor:pointer}.danger{background:#dc2626}</style>
</head><body><div class="banner">农服数字平台</div><div class="wrap"><div class="card"><h1>用户管理</h1><p><a href="/dashboard">返回首页</a></p><p id="msg"></p>
<div><input id="username" placeholder="用户名"/><input id="password" placeholder="密码" value="123456"/><select id="role"></select><button id="add">新增用户</button></div><br/>
<table><thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
const token=localStorage.getItem('token');if(!token)location.href='/admin';const msg=document.getElementById('msg');
async function roles(){const r=await fetch('/api/system/role',{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)return;const sel=document.getElementById('role');sel.innerHTML='';d.items.forEach(x=>{const o=document.createElement('option');o.value=x.code;o.textContent=`${x.name}(${x.code})`;sel.appendChild(o);});}
async function load(){const r=await fetch('/api/system/user',{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'加载失败';return;}const rows=document.getElementById('rows');rows.innerHTML='';d.items.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${x.id}</td><td>${x.username}</td><td>${x.role}</td><td><button onclick="editUser('${x.username}','${x.role}')">改</button> <button class='danger' onclick="delUser('${x.username}')">删</button></td>`;rows.appendChild(tr);});}
async function add(){const body={username:username.value,password:password.value,role:role.value};const r=await fetch('/api/system/user',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify(body)});const d=await r.json();msg.textContent=r.ok?d.message:d.detail;load();}
async function editUser(u,oldRole){const newPwd=prompt('新密码', '123456');if(newPwd===null)return;const newRole=prompt('新角色编码', oldRole) || oldRole;const r=await fetch(`/api/system/user/${u}`,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({username:u,password:newPwd,role:newRole})});const d=await r.json();msg.textContent=r.ok?d.message:d.detail;load();}
async function delUser(u){if(!confirm(`确认删除 ${u} ?`))return;const r=await fetch(`/api/system/user/${u}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});const d=await r.json();msg.textContent=r.ok?d.message:d.detail;load();}
window.editUser=editUser;window.delUser=delUser;document.getElementById('add').addEventListener('click',add);roles();load();
</script></body></html>
