<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>提交需求</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>提交服务需求</div><h1>提交需求</h1><p><a href='/mini/farmer-home'>返回首页</a> | <a href='/mini/farmer-demand-list'>我的需求</a></p><p id='msg'></p><textarea id='json' rows='12'></textarea><button onclick='submitIt()'>提交需求</button><script>const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';const q=new URLSearchParams(location.search);json.value=JSON.stringify({providerId:Number(q.get('providerId')||10001),abilityId:Number(q.get('abilityId')||20001),serviceType:q.get('serviceType')||'AGRICULTURAL_MACHINERY',contactName:'张三',contactPhone:'13800000000',regionCode:'360000',serviceAddress:'某县某乡镇某村',quantity:50,unit:'亩',expectedTime:'2026-05-01 09:00:00',remark:'需要收割服务'},null,2);async function submitIt(){const r=await fetch('/api/farmer/demand/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:json.value});const d=await r.json();msg.textContent=r.ok?`提交成功，需求ID：${d.data.demandId}`:(d.detail||'提交失败');if(r.ok)setTimeout(()=>location.href='/mini/farmer-demand-list',800);}</script></body></html>
