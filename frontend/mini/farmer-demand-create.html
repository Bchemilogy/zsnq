<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>提交需求</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>提交服务需求</div><h1>提交需求</h1><p><a href='/mini/farmer-home'>返回首页</a> | <a href='/mini/farmer-demand-list'>我的需求</a></p><p id='msg'></p><div class='card'><label>联系人</label><input id='contactName' value='张三'><label>联系电话</label><input id='contactPhone' value='13800000000'><label>服务地址</label><input id='serviceAddress' value='某县某乡镇某村'><label>数量</label><input id='quantity' value='50'><label>单位</label><input id='unit' value='亩'><label>期望时间</label><input id='expectedTime' value='2026-05-01 09:00:00'><label>备注</label><textarea id='remark'>需要收割服务</textarea><button onclick='submitIt()'>提交需求</button></div><script>const t=localStorage.getItem('mini_token');const q=new URLSearchParams(location.search);const base={providerId:Number(q.get('providerId')||10001),abilityId:Number(q.get('abilityId')||20001),serviceType:q.get('serviceType')||'AGRICULTURAL_MACHINERY',regionCode:'360000'};async function submitIt(){const body={...base,contactName:contactName.value,contactPhone:contactPhone.value,serviceAddress:serviceAddress.value,quantity:Number(quantity.value),unit:unit.value,expectedTime:expectedTime.value,remark:remark.value};const r=await fetch('/api/farmer/demand/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify(body)});const d=await r.json();msg.textContent=r.ok?`提交成功，需求ID：${d.data.demandId}`:(d.detail||'提交失败');if(r.ok)setTimeout(()=>location.href='/mini/farmer-demand-list',800);}</script></body></html>
