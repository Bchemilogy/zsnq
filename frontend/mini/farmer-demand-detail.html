<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>需求详情</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>需求详情</div><h1>需求详情</h1><p><a href='/mini/farmer-demand-list'>返回列表</a></p><div id='info' class='card'></div><script>const t=localStorage.getItem('mini_token');const id=new URLSearchParams(location.search).get('id');const typeMap={AGRICULTURAL_MACHINERY:'农机服务',SEEDLING:'育秧服务',DRYING:'烘干服务',STORAGE:'仓储服务',PLANTING_GUIDE:'种植指导',OTHER:'其他服务'};const statusMap={SUBMITTED:'已提交',CONTACTED:'已联系',SERVICING:'服务中',COMPLETED:'已完成',CANCELLED:'已取消'};fetch(`/api/farmer/demand/detail?id=${id}`,{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(d=>{const x=d.data||{};info.innerHTML=`<p>需求ID：${x.id}</p><p>服务类型：${typeMap[x.serviceType]||x.serviceType}</p><p>联系人：${x.contactName||''}</p><p>联系电话：${x.contactPhone||''}</p><p>服务地址：${x.serviceAddress||''}</p><p>数量：${x.quantity||0}${x.unit||''}</p><p>期望时间：${x.expectedTime||''}</p><p>备注：${x.remark||''}</p><p>状态：${statusMap[x.status]||x.status}</p>`});</script></body></html>
