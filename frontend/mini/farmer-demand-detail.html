<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>需求详情</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>需求详情</div><h1>需求详情</h1><p><a href='/mini/farmer-demand-list'>返回列表</a></p><div id='info' class='card'></div><script>const t=localStorage.getItem('mini_token');const id=new URLSearchParams(location.search).get('id');fetch(`/api/farmer/demand/detail?id=${id}`,{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(d=>{const x=d.data||{};info.innerHTML=`<p>ID: ${x.id}</p><p>服务类型: ${x.serviceType}</p><p>服务方: ${x.providerId}</p><p>能力: ${x.abilityId}</p><p>地址: ${x.serviceAddress}</p><p>数量: ${x.quantity}${x.unit||''}</p><p>状态: ${x.status}</p><p>期望时间: ${x.expectedTime||''}</p>`});</script></body></html>
