<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>我的需求</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>我的需求</div><h1>我的需求列表</h1><p><a href='/mini/farmer-home'>返回首页</a></p><table><thead><tr><th>ID</th><th>服务类型</th><th>地址</th><th>数量</th><th>状态</th><th>操作</th></tr></thead><tbody id='rows'></tbody></table><script>const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';async function cancel(id){const r=await fetch('/api/farmer/demand/cancel',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({demandId:id})});const d=await r.json();alert(d.message||d.detail);load();}window.cancelDemand=cancel;async function load(){const r=await fetch('/api/farmer/demand/list',{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();rows.innerHTML=(d.data||[]).map(x=>`<tr><td>${x.id}</td><td>${x.serviceType}</td><td>${x.serviceAddress}</td><td>${x.quantity}${x.unit||''}</td><td>${x.status}</td><td><a href='/mini/farmer-demand-detail?id=${x.id}'>详情</a> <button onclick='cancelDemand(${x.id})'>取消</button></td></tr>`).join('');}load();</script></body></html>
