<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1.0'/><title>服务方详情</title><link rel='stylesheet' href='/theme.css'/></head><body><div class='banner'>服务方详情</div><h1>服务方详情</h1><p><a id='backLink' href='/mini/farmer-index'>返回农户找服务</a></p><p id='msg'></p><div id='info'></div><div class='card'><h3>预估总金额</h3><label>当前需求亩数</label><input id='demandMu' type='number' step='0.01' placeholder='请输入亩数'><p id='amountText'>请输入亩数后自动计算</p></div><div class='card'><button id='demandBtn'>提交服务需求</button> <button id='phoneBtn'>一键电话联系</button> <button id='wechatBtn'>复制微信号并留痕</button></div><script>
const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';const q=new URLSearchParams(location.search);const providerId=q.get('providerId');const abilityId=q.get('abilityId');const st=q.get('serviceType')||'';if(st)backLink.href='/mini/farmer-service-list?serviceType='+encodeURIComponent(st);let detail=null;const map={AGRICULTURAL_MACHINERY:'农机服务',SEEDLING:'育秧服务',DRYING:'烘干服务',STORAGE:'仓储服务',PLANTING_GUIDE:'种植指导',OTHER:'其他服务'};const statusMap={AVAILABLE:'可服务',BUSY:'服务繁忙',OFFLINE:'暂停服务'};
function parsePricePerMu(txt){const s=String(txt||'').trim();const n=Number((s.match(/\d+(\.\d+)?/)||[])[0]||'');return Number.isFinite(n)?n:0}
function refreshAmount(){if(!detail)return;const mu=Number(demandMu.value||0);const price=parsePricePerMu(detail.ability.priceDesc);if(!mu||!price){amountText.textContent='请输入亩数并确保价格说明含“元/亩”数值';return;}const total=mu*price;amountText.textContent=`预估总金额：${total} 元`;}
async function load(){const r=await fetch(`/api/farmer/provider/detail?providerId=${providerId}&abilityId=${abilityId}`,{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'加载失败';return;}detail=d.data;const p=detail.provider,a=detail.ability;info.innerHTML=`<div class='card'><h3>${p.providerName}</h3><p>联系人：${p.contactName||'-'} ${p.contactPhone||''}</p><p>服务类型：${map[a.serviceType]||a.serviceType}</p><p>服务名称：${a.abilityName}</p><p>服务区域：${a.serviceArea||'-'}</p><p>服务说明：${a.abilityDesc||'-'}</p><p>价格说明：${a.priceDesc||'-'}</p><p>设备数量：${a.equipmentCount||0}</p><p>状态：${statusMap[a.availableStatus]||a.availableStatus||'可服务'}</p></div>`;refreshAmount()}
async function logContact(type){const r=await fetch('/api/farmer/contact-log/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({providerId:Number(providerId),abilityId:Number(abilityId),contactType:type,sourcePage:'SERVICE_DETAIL'})});const d=await r.json();if(!r.ok){alert(d.detail||'记录失败');return false;}return true;}
phoneBtn.onclick=async()=>{if(await logContact('PHONE'))alert('请拨打：'+(detail.ability.contactPhone||detail.provider.contactPhone||''));};
wechatBtn.onclick=async()=>{if(await logContact('WECHAT'))navigator.clipboard.writeText(detail.ability.wechatNo||'').then(()=>alert('微信号已复制')).catch(()=>alert('微信号：'+(detail.ability.wechatNo||'无')));};
demandBtn.onclick=()=>location.href=`/mini/farmer-demand-create?providerId=${providerId}&abilityId=${abilityId}&serviceType=${detail.ability.serviceType}`;
demandMu.oninput=refreshAmount;
load();
</script></body></html>
