<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1.0'/><title>服务方详情</title><link rel='stylesheet' href='/theme.css'/></head><body><div class='banner'>服务方详情</div><h1>服务方详情</h1><p><a href='/mini/farmer-service-list'>返回列表</a></p><p id='msg'></p><div id='info'></div><div class='card'><h3>服务能力可视化</h3><p>处理量参考</p><div id='bar' style='height:12px;background:#e5e7eb;border-radius:6px;overflow:hidden'><div id='barInner' style='height:100%;width:0;background:#22c55e'></div></div><p id='barText'></p></div><div class='card'><button id='demandBtn'>提交服务需求</button> <button id='phoneBtn'>一键电话联系</button> <button id='wechatBtn'>复制微信号并留痕</button></div><script>
const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';const q=new URLSearchParams(location.search);const providerId=q.get('providerId');const abilityId=q.get('abilityId');let detail=null;
async function load(){const r=await fetch(`/api/farmer/provider/detail?providerId=${providerId}&abilityId=${abilityId}`,{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'加载失败';return;}detail=d.data;const p=detail.provider,a=detail.ability;info.innerHTML=`<div class='card'><h3>${p.providerName}</h3><p>联系人：${p.contactName||'-'} ${p.contactPhone||''}</p><p>服务类型：${a.serviceType}</p><p>服务名称：${a.abilityName}</p><p>服务区域：${a.serviceArea||'-'}</p><p>服务说明：${a.abilityDesc||'-'}</p><p>价格说明：${a.priceDesc||'-'}</p><p>设备数量：${a.equipmentCount||0}</p><p>状态：${a.availableStatus||'AVAILABLE'}</p></div>`;const qty=Math.max(0,Math.min(100,Number(a.equipmentCount||0)*10));barInner.style.width=qty+'%';barText.textContent=`设备能力指数：${qty}/100`;}
async function logContact(type){const r=await fetch('/api/farmer/contact-log/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({providerId:Number(providerId),abilityId:Number(abilityId),contactType:type,sourcePage:'SERVICE_DETAIL'})});const d=await r.json();if(!r.ok){alert(d.detail||'记录失败');return false;}return true;}
phoneBtn.onclick=async()=>{if(await logContact('PHONE'))alert('请拨打：'+(detail.ability.contactPhone||detail.provider.contactPhone||''));};
wechatBtn.onclick=async()=>{if(await logContact('WECHAT'))navigator.clipboard.writeText(detail.ability.wechatNo||'').then(()=>alert('微信号已复制')).catch(()=>alert('微信号：'+(detail.ability.wechatNo||'无')));};
demandBtn.onclick=()=>location.href=`/mini/farmer-demand-create?providerId=${providerId}&abilityId=${abilityId}&serviceType=${detail.ability.serviceType}`;
load();
</script></body></html>
