<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1.0'/><title>找服务</title><link rel='stylesheet' href='/theme.css'/></head><body><div class='banner'>农户找服务</div><h1>服务方列表</h1><p><a href='/mini/farmer-index'>返回农户找服务</a></p><div class='card'><label>关键词</label><input id='keyword' placeholder='服务方名称/服务名称'/><label>服务区域</label><input id='serviceArea' placeholder='例如：南昌县'/><button id='searchBtn'>搜索</button></div><p id='msg'></p><div id='list'></div><script>
const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';const map={AGRICULTURAL_MACHINERY:'农机服务',SEEDLING:'育秧服务',DRYING:'烘干服务',STORAGE:'仓储服务',PLANTING_GUIDE:'种植指导',OTHER:'其他服务'};const statusMap={AVAILABLE:'可服务',BUSY:'服务繁忙',OFFLINE:'暂停服务'};
async function load(){const q=new URLSearchParams(location.search);const serviceType=q.get('serviceType')||'';const kw=keyword.value.trim();const area=serviceArea.value.trim();if(!kw&&!area){msg.textContent='请输入关键词或服务区域后搜索';list.innerHTML='';return;}const mixKeyword=[kw,area].filter(Boolean).join(' ');const params=new URLSearchParams({serviceType,keyword:mixKeyword,pageNum:'1',pageSize:'50'});const r=await fetch(`/api/farmer/provider/list?${params.toString()}`,{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'加载失败';return;}const items=d.data.items||[];msg.textContent=`共 ${d.data.total} 条`;if(!items.length){list.innerHTML='';alert('未找到符合条件的服务方');return;}list.innerHTML=items.map(x=>`<div class='card'><h3>${x.providerName}</h3><p>服务类型：${map[x.serviceType]||x.serviceType}</p><p>服务名称：${x.abilityName}</p><p>服务区域：${x.serviceArea||'-'}</p><p>联系电话：${x.contactPhone||'-'}</p><p>状态：${statusMap[x.availableStatus]||x.availableStatus}</p><a href='/mini/farmer-provider-detail?providerId=${x.providerId}&abilityId=${x.abilityId}&serviceType=${serviceType}'>查看详情</a></div>`).join('')}
searchBtn.onclick=load;msg.textContent='请输入关键词或服务区域后搜索';
</script></body></html>
