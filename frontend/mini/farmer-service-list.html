<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1.0'/><title>找服务</title><link rel='stylesheet' href='/theme.css'/></head><body><div class='banner'>农户找服务</div><h1>服务方列表</h1><p><a href='/mini/farmer-home'>返回首页</a></p><div class='card'><label>关键词</label><input id='keyword' placeholder='服务方名称/服务名称'/><label>区域编码</label><input id='regionCode' placeholder='如 360000'/><button id='searchBtn'>搜索</button></div><p id='msg'></p><div id='list'></div><script>
const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';
async function load(){const q=new URLSearchParams(location.search);const serviceType=q.get('serviceType')||'';const kw=keyword.value.trim();const rc=regionCode.value.trim();const params=new URLSearchParams({serviceType,keyword:kw,regionCode:rc,pageNum:'1',pageSize:'50'});const r=await fetch(`/api/farmer/provider/list?${params.toString()}`,{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'加载失败';return;}const items=d.data.items||[];msg.textContent=`共 ${d.data.total} 条`;list.innerHTML=items.map(x=>`<div class='card'><h3>${x.providerName}</h3><p>服务类型：${x.serviceType}</p><p>服务名称：${x.abilityName}</p><p>服务区域：${x.serviceArea||'-'}</p><p>联系电话：${x.contactPhone||'-'}</p><p>状态：${x.availableStatus}</p><a href='/mini/farmer-provider-detail?providerId=${x.providerId}&abilityId=${x.abilityId}'>查看详情</a></div>`).join('')||'<p>暂无数据</p>'}
searchBtn.onclick=load;load();
</script></body></html>
