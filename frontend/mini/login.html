<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小程序登录测试页</title>
  </head>
  <body>
    <h1>小程序登录测试页（最小版）</h1>
    <p>模拟微信登录 code：</p>
    <button data-code="farmer-test-code">农户测试登录</button>
    <button data-code="provider-test-code">服务方测试登录</button>
    <p>
      自定义 code：<input id="code" />
      <button id="custom-login">使用自定义 code 登录</button>
    </p>
    <p><a href="/mini/bind-phone">去绑定手机号预留页</a></p>
    <p id="msg"></p>

    <script>
      const msg = document.getElementById('msg');

      async function doLogin(code) {
        msg.textContent = '登录中...';
        const res = await fetch('/api/auth/wechat-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.detail || '登录失败';
          return;
        }

        localStorage.setItem('mini_token', data.token);
        const userRes = await fetch('/api/auth/current-user', {
          headers: { Authorization: `Bearer ${data.token}` },
        });
        const user = await userRes.json();

        if (!userRes.ok) {
          msg.textContent = user.detail || '获取用户失败';
          return;
        }

        if (user.role === 'FARMER') {
          location.href = '/mini/farmer-home';
          return;
        }
        if (user.role === 'PROVIDER') {
          location.href = '/mini/provider-home';
          return;
        }
        location.href = '/mini/role-select';
      }

      document.querySelectorAll('button[data-code]').forEach((btn) => {
        btn.addEventListener('click', () => doLogin(btn.dataset.code));
      });

      document.getElementById('custom-login').addEventListener('click', () => {
        const code = document.getElementById('code').value.trim();
        if (!code) {
          msg.textContent = '请输入 code';
          return;
        }
        doLogin(code);
      });
    </script>
  </body>
</html>
