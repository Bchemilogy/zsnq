<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>服务能力详情</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>服务能力详情</div><h1>服务能力详情</h1><p><a href='/mini/provider-ability-list'>返回我的能力</a></p><div id='detail' class='card'></div><script>const t=localStorage.getItem('mini_token');const id=new URLSearchParams(location.search).get('id');if(!id)detail.textContent='缺少能力ID';else fetch(`/api/provider/ability/detail?id=${id}`,{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(d=>{if(d.detail){detail.textContent=d.detail;return;}const x=d.data;detail.innerHTML=`<p>服务类型：${x.serviceType}</p><p>服务名称：${x.abilityName}</p><p>服务说明：${x.abilityDesc||''}</p><p>服务区域：${x.serviceArea||''}</p><p>联系电话：${x.contactPhone||''}</p><p>微信：${x.wechatNo||''}</p><p>价格说明：${x.priceDesc||''}</p><p>设备数量：${x.equipmentCount||0}</p><p>日能力：${x.dailyCapacity||''}</p><p>状态：${x.status}</p>`});</script></body></html>
