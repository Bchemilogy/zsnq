<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1.0'/><title>新增服务能力</title><link rel='stylesheet' href='/theme.css'/></head><body><div class="banner">农服数字平台</div><h1 id='title'>新增服务能力</h1><p><a href='/mini/provider-ability-list'>返回能力列表</a></p>
<form id='f' class='card'>
<p>服务类型<select id='serviceType'><option value='AGRICULTURAL_MACHINERY'>农机服务</option><option value='SEEDLING'>育秧服务</option><option value='DRYING'>烘干服务</option><option value='STORAGE'>仓储服务</option><option value='PLANTING_GUIDE'>种植指导</option><option value='OTHER'>其他服务</option></select></p>
<p>能力名称<input id='abilityName' required/></p><p>能力说明<textarea id='abilityDesc'></textarea></p><p>服务区域<input id='serviceArea'/></p><p>联系电话<input id='contactPhone'/></p><p>微信号<input id='wechatNo'/></p><p>价格说明<input id='priceDesc'/></p><p>设备名称<input id='equipmentName'/></p><p>设备数量<input id='equipmentCount' type='number' value='1'/></p><p>日能力<input id='dailyCapacity'/></p>
<button type='submit'>保存</button></form><p id='msg'></p><script>const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';const id=Number(new URLSearchParams(location.search).get('id')||0);if(id){title.textContent='查看/编辑服务能力';fetch(`/api/provider/ability/detail?id=${id}`,{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(d=>{const x=d.data||{};['serviceType','abilityName','abilityDesc','serviceArea','contactPhone','wechatNo','priceDesc','equipmentName','dailyCapacity'].forEach(k=>{if(document.getElementById(k))document.getElementById(k).value=x[k]||''});equipmentCount.value=x.equipmentCount||0;});}
document.getElementById('f').addEventListener('submit',async(e)=>{e.preventDefault();const body={id:id||null,serviceType:serviceType.value,abilityName:abilityName.value,abilityDesc:abilityDesc.value,serviceArea:serviceArea.value,contactPhone:contactPhone.value,wechatNo:wechatNo.value,priceDesc:priceDesc.value,equipmentName:equipmentName.value,equipmentCount:Number(equipmentCount.value||0),dailyCapacity:dailyCapacity.value,imageUrls:[]};const api=id?'/api/provider/ability/update':'/api/provider/ability/create';const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify(body)});const d=await r.json();if(r.ok){alert(d.message||'保存成功');location.href='/mini/provider-ability-list';}else{msg.textContent=d.detail;}});
</script></body></html>
