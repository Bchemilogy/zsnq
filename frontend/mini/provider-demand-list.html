<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>农户需求</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>服务方需求处理</div><h1>农户需求列表</h1><p><a href='/mini/provider-home'>返回工作台</a></p><p id='msg'></p><table><thead><tr><th>ID</th><th>联系人</th><th>地址</th><th>数量</th><th>状态</th><th>操作</th></tr></thead><tbody id='rows'></tbody></table><script>const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';async function post(url,demandId){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({demandId})});const d=await r.json();alert(d.message||d.detail);load();}window.contact=(id)=>post('/api/provider/demand/contacted',id);window.startSvc=(id)=>post('/api/provider/demand/start-service',id);window.toRecord=(id)=>location.href=`/mini/provider-record-create?demandId=${id}`;async function load(){const r=await fetch('/api/provider/demand/list',{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'加载失败';return;}const items=d.data||[];msg.textContent=`共 ${items.length} 条`;rows.innerHTML=items.map(x=>`<tr><td>${x.id}</td><td>${x.contactName}</td><td>${x.serviceAddress}</td><td>${x.quantity}${x.unit||''}</td><td>${x.status}</td><td><button onclick='contact(${x.id})'>已联系</button> <button onclick='startSvc(${x.id})'>服务中</button> <button onclick='toRecord(${x.id})'>上传记录</button></td></tr>`).join('');}load();</script></body></html>
