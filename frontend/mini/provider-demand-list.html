<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>农户需求</title><link rel='stylesheet' href='/theme.css'><style>table{width:100%;border-collapse:collapse}th,td{border:1px solid #dbe4db;padding:8px}th{background:#eef7ee}.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.actions select,.actions button{margin:0}</style></head><body><div class='banner'>服务方需求处理</div><h1>农户需求列表</h1><p><a href='/mini/provider-home'>返回工作台</a></p><p id='msg'></p><div class='table-wrap'><table><thead><tr><th>ID</th><th>联系人</th><th>联系电话</th><th>地址</th><th>状态</th><th style='width:300px'>操作</th></tr></thead><tbody id='rows'></tbody></table></div><div id='detail' class='card'></div><script>const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';const statusMap={SUBMITTED:'已提交',CONTACTED:'已联系',SERVICING:'服务中',COMPLETED:'已完成'};const typeMap={AGRICULTURAL_MACHINERY:'农机服务',SEEDLING:'育秧服务',DRYING:'烘干服务',STORAGE:'仓储服务',PLANTING_GUIDE:'种植指导',OTHER:'其他服务'};async function post(url,demandId){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({demandId})});const d=await r.json();alert(d.message||d.detail);load();}window.markContact=(id,val)=>val==='YES'?post('/api/provider/demand/contacted',id):alert('保持未联系');window.markDone=(id,val)=>val==='YES'?location.href=`/mini/provider-record-create?demandId=${id}`:alert('保持未完成');window.viewDetail=async(id)=>{const r=await fetch(`/api/provider/demand/detail?id=${id}`,{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();const x=d.data||{};detail.innerHTML=`<h3>需求详情 #${x.id}</h3><p>服务类型：${typeMap[x.serviceType]||x.serviceType}</p><p>联系人：${x.contactName} ${x.contactPhone}</p><p>地址：${x.serviceAddress}</p><p>数量：${x.quantity}${x.unit||''}</p><p>期望时间：${x.expectedTime||''}</p><p>备注：${x.remark||''}</p>`};async function load(){const r=await fetch('/api/provider/demand/list',{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'加载失败';return;}const items=d.data||[];msg.textContent=`共 ${items.length} 条`;rows.innerHTML=items.map(x=>`<tr><td>${x.id}</td><td>${x.contactName}</td><td>${x.contactPhone}</td><td>${x.serviceAddress}</td><td>${statusMap[x.status]||x.status}</td><td><div class='actions'><button onclick='viewDetail(${x.id})'>查看详情</button><span>联系</span><select onchange="markContact(${x.id},this.value)"><option value='NO'>未联系</option><option value='YES'>已联系</option></select><span>完成</span><select onchange="markDone(${x.id},this.value)"><option value='NO'>未完成</option><option value='YES'>已完成</option></select></div></td></tr>`).join('');}load();</script></body></html>
