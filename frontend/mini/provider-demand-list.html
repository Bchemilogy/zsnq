<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>农户需求</title><link rel='stylesheet' href='/theme.css'><style>table{width:100%;border-collapse:collapse}th,td{border:1px solid #dbe4db;padding:8px}th{background:#eef7ee}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}</style></head><body><div class='banner'>服务方需求处理</div><h1>农户需求列表</h1><p><a href='/mini/provider-home'>返回工作台</a></p><p id='msg'></p><div class='table-wrap'><table><thead><tr><th>ID</th><th>联系人</th><th>联系电话</th><th>地址</th><th>状态</th><th style='width:260px'>操作</th></tr></thead><tbody id='rows'></tbody></table></div><script>const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';function uiStatus(s){if(s==='CONTACTED')return{contact:'已联系',progress:'未完成'};if(s==='SERVICING')return{contact:'已联系',progress:'服务中'};if(s==='COMPLETED')return{contact:'已联系',progress:'已完成'};return{contact:'未联系',progress:'未完成'}}async function post(url,demandId){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({demandId})});const d=await r.json();if(!r.ok)alert(d.detail||'操作失败');}window.markContact=async(id,val)=>{if(val==='YES'){await post('/api/provider/demand/contacted',id);load();}};window.markProgress=async(id,val)=>{if(val==='SERVICING'){await post('/api/provider/demand/start-service',id);load();}if(val==='COMPLETED')location.href=`/mini/provider-record-create?demandId=${id}`;};function selectedByStatus(s){const u=uiStatus(s);return {contact:u.contact==='已联系'?'YES':'NO',progress:u.progress==='服务中'?'SERVICING':(u.progress==='已完成'?'COMPLETED':'NO')}}async function load(){const r=await fetch('/api/provider/demand/list',{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'加载失败';return;}const items=d.data||[];msg.textContent=`共 ${items.length} 条`;rows.innerHTML=items.map(x=>{const u=uiStatus(x.status);const s=selectedByStatus(x.status);return `<tr><td>${x.id}</td><td>${x.contactName}</td><td>${x.contactPhone}</td><td>${x.serviceAddress}</td><td>${u.contact} / ${u.progress}</td><td><div class='actions'><a href='/mini/provider-demand-detail?id=${x.id}'>查看详情</a><select onchange="markContact(${x.id},this.value)"><option value='NO' ${s.contact==='NO'?'selected':''}>未联系</option><option value='YES' ${s.contact==='YES'?'selected':''}>已联系</option></select><select onchange="markProgress(${x.id},this.value)"><option value='NO' ${s.progress==='NO'?'selected':''}>未完成</option><option value='SERVICING' ${s.progress==='SERVICING'?'selected':''}>服务中</option><option value='COMPLETED' ${s.progress==='COMPLETED'?'selected':''}>已完成</option></select></div></td></tr>`}).join('');}load();</script></body></html>
