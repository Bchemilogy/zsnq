<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>服务方工作台</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>服务方工作台</div><h1>服务方工作台（仅审核通过可进入）</h1><p id='state'></p><div id='profile' class='card'></div><p><a href='/mini/provider-profile'>我的资料/入驻资料</a> | <a href='/mini/provider-ability-list'>服务能力管理</a> | <a href='/mini/provider-demand-list'>农户需求</a></p><button id='logout'>退出登录</button><script>const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';async function load(){const r=await fetch('/api/provider/workbench',{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();if(!r.ok){if((d.detail||'').includes('尚未审核通过'))location.href='/mini/provider-apply-status';else profile.textContent=d.detail||'加载失败';return;}state.textContent=`当前状态：${d.data.auditStatus}`;profile.innerHTML=`<p><b>${d.data.providerName}</b></p><p>服务方ID：${d.data.providerId}</p><p>联系电话：${d.data.contactPhone}</p><p>服务区域：${d.data.serviceArea}</p><p>资料完整度：${d.data.profileCompletion}%</p>`;}logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',headers:{Authorization:`Bearer ${t}`}});localStorage.removeItem('mini_token');location.href='/mini/login'};load();</script></body></html>
