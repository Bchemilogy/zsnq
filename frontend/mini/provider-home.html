<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>服务方工作台</title>
    <style>body{font-family:Arial,'Microsoft YaHei';background:#ecfeff;margin:0}.wrap{max-width:760px;margin:26px auto;padding:0 12px}.card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 10px 24px rgba(15,23,42,.08)}</style>
  </head>
  <body>
    <div class="wrap"><div class="card">
      <h1>服务方工作台（仅审核通过可进入）</h1>
      <p id="state"></p>
      <pre id="data"></pre>
      <p><a href="/mini/provider-onboard">我的资料/入驻资料</a></p>
      <p><a href="/mini/provider-ability-list">服务能力管理</a></p>
      <button id="logout">退出登录</button>
    </div></div>

    <script>
      const token = localStorage.getItem('mini_token');
      if (!token) location.href = '/mini/login';

      async function loadWorkbench() {
        const res = await fetch('/api/provider/workbench', { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        if (!res.ok) {
          if ((data.detail || '').includes('尚未审核通过')) {
            location.href = '/mini/provider-apply-status';
            return;
          }
          document.getElementById('data').textContent = data.detail || '加载失败';
          return;
        }
        document.getElementById('state').textContent = `当前状态：已通过（${data.data.auditStatus}）`;
        document.getElementById('data').textContent = JSON.stringify(data.data, null, 2);
      }

      document.getElementById('logout').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
        localStorage.removeItem('mini_token');
        location.href = '/mini/login';
      });

      loadWorkbench();
    </script>
  </body>
</html>
