<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>服务方专用登录</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>服务方专用登录</div><h1>服务方测试登录</h1><p><a href='/mini/login'>返回通用登录</a></p><p id='msg'></p><div class='card'><button class='btn' id='approved'>已审核通过账号登录（进工作台）</button><button class='btn' id='newUser'>未审核账号登录（进资料填写）</button></div><script>async function doLogin(code){msg.textContent='登录中...';const res=await fetch('/api/auth/wechat-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const data=await res.json();if(!res.ok){msg.textContent=data.detail||'登录失败';return;}localStorage.setItem('mini_token',data.token);const statusRes=await fetch('/api/provider/apply/status',{headers:{Authorization:`Bearer ${data.token}`}});const st=await statusRes.json();if(st.auditStatus==='APPROVED'){location.href='/mini/provider-home';return;}if(st.auditStatus==='NOT_SUBMITTED'){location.href='/mini/provider-onboard';return;}if(st.auditStatus==='PENDING'){location.href='/mini/provider-apply-status';return;}if(st.auditStatus==='REJECTED'){location.href='/mini/provider-apply-reject';return;}msg.textContent='状态:'+st.auditStatus;}approved.onclick=()=>doLogin('provider-test-code');newUser.onclick=()=>doLogin('provider-new-test-code');</script></body></html>
