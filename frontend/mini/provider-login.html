<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>服务方专用登录</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>服务方专用登录</div><h1>服务方测试登录</h1><p><a href='/mini/login'>返回通用登录</a></p><p id='msg'></p><div class='card'><h3>已审核通过账号登录（进工作台）</h3><label>请输入联系电话</label><input id='phone' placeholder='例如 13800000000'><button class='btn' id='approved'>按联系电话登录</button><hr/><h3>未审核账号登录（进资料填写）</h3><button class='btn' id='newUser'>进入服务方入驻申请页面</button></div><script>async function approvedLogin(){msg.textContent='校验中...';const contactPhone=phone.value.trim();if(!contactPhone){msg.textContent='请输入联系电话';return;}const res=await fetch('/api/auth/provider-phone-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contactPhone})});const data=await res.json();if(!res.ok){msg.textContent=data.detail||'登录失败';return;}localStorage.setItem('mini_token',data.token);location.href='/mini/provider-home';}approved.onclick=approvedLogin;newUser.onclick=async()=>{msg.textContent='登录中...';const res=await fetch('/api/auth/wechat-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:'provider-new-test-code'})});const data=await res.json();if(!res.ok){msg.textContent=data.detail||'登录失败';return;}localStorage.setItem('mini_token',data.token);location.href='/mini/provider-onboard';};</script></body></html>
