<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>服务方入驻申请</title><link rel='stylesheet' href='/theme.css'/>
    <style>
      body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f1f5f9;margin:0}
      .wrap{max-width:860px;margin:24px auto;padding:0 12px}
      .card{background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(15,23,42,.1);padding:18px}
      .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row1{display:grid;grid-template-columns:1fr;gap:12px}
      input,textarea,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}
      .btn{padding:10px 14px;border:0;border-radius:8px;color:#fff;cursor:pointer}
      .b1{background:#2563eb}.b2{background:#0ea5e9}.b3{background:#f59e0b}
      .stype-table{width:100%;border-collapse:collapse}
      .stype-table td{border:1px solid #e2e8f0;padding:8px 10px;vertical-align:middle}
    </style>
  </head>
  <body><div class="banner">农服数字平台</div>
    <div class="wrap">
      <div class="card">
        <h1>服务方入驻申请</h1>
        <p><a href="/mini/login">返回登录页</a> | <a href="/mini/provider-apply-status">查看审核状态</a></p>
        <form id="form">
          <div class="row">
            <label>主体名称<input id="providerName" required /></label>
            <label>联系人<input id="contactName" required /></label>
          </div>
          <div class="row">
            <label>联系电话<input id="contactPhone" required value="13800000000" /></label>
            <label>服务方类型
              <select id="providerType"><option value="PERSONAL">个人</option><option value="COOPERATIVE">合作社</option><option value="ENTERPRISE">企业</option><option value="BIG_FARM">种植大户</option></select>
            </label>
          </div>
          <div class="row">
            <label>区域编码<input id="regionCode" value="360000" /></label>
            <label>服务区域<input id="serviceArea" required /></label>
          </div>
          <div class="row1">
            <label>详细地址<input id="address" required /></label>
            <label>服务类型（可多选）</label>
            <table id="serviceTypes" class="stype-table">
              <tr>
                <td><label><input type="checkbox" value="AGRICULTURAL_MACHINERY" checked /> 农机服务</label></td>
                <td><label><input type="checkbox" value="SEEDLING" /> 育秧服务</label></td>
                <td><label><input type="checkbox" value="DRYING" checked /> 烘干服务</label></td>
              </tr>
              <tr>
                <td><label><input type="checkbox" value="STORAGE" /> 仓储服务</label></td>
                <td><label><input type="checkbox" value="PLANTING_GUIDE" /> 种植指导</label></td>
                <td><label><input type="checkbox" value="OTHER" /> 其他服务</label></td>
              </tr>
            </table>
            <label>服务能力说明<textarea id="serviceDescription" rows="3"></textarea></label>
          </div>

          <h3>附件上传（真实文件上传到后端模拟存储）</h3>
          <div class="row">
            <label>营业执照<input id="licenseFile" type="file" accept=".jpg,.jpeg,.png,.pdf" /></label>
            <label>设备照片<input id="deviceFile" type="file" accept=".jpg,.jpeg,.png" /></label>
          </div>
          <div class="row">
            <label>其他文件<input id="otherFile" type="file" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx,.xls,.xlsx" /></label>
          </div>
          <p>
            <button class="btn b2" type="button" id="uploadFiles">先上传附件</button>
            <button class="btn b1" type="submit">提交入驻申请</button>
            <button class="btn b3" type="button" id="resubmit">驳回后重提</button>
          </p>
        </form>
      </div>
    </div>

    <script>
      const token = localStorage.getItem('mini_token');
      if (!token) location.href = '/mini/login';
      let attachments = [];
      let uploaded = false;

      async function uploadOne(file, fileTag) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('fileType', (file.name.split('.').pop() || '').toLowerCase());
        const res = await fetch('/api/file/upload', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '上传失败');
        return { fileType: fileTag, fileName: data.data.fileName, fileUrl: data.data.fileUrl };
      }

      document.getElementById('uploadFiles').addEventListener('click', async () => {
        try {
          const licenseFile = document.getElementById('licenseFile').files[0];
          const deviceFile = document.getElementById('deviceFile').files[0];
          const otherFile = document.getElementById('otherFile').files[0];
          if (!licenseFile || !deviceFile) return alert('请先选择营业执照和设备照片文件');
          const list = [await uploadOne(licenseFile, 'BUSINESS_LICENSE'), await uploadOne(deviceFile, 'DEVICE_PHOTO')];
          if (otherFile) list.push(await uploadOne(otherFile, 'OTHER_FILE'));
          attachments = list;
          uploaded = true;
          alert(`附件上传成功，共 ${attachments.length} 个文件`);
        } catch (e) { alert(e.message); }
      });

      function buildPayload() {
        return {
          providerName: document.getElementById('providerName').value,
          contactName: document.getElementById('contactName').value,
          contactPhone: document.getElementById('contactPhone').value,
          providerType: document.getElementById('providerType').value,
          regionCode: document.getElementById('regionCode').value,
          address: document.getElementById('address').value,
          serviceTypes: Array.from(document.querySelectorAll('#serviceTypes input[type="checkbox"]:checked')).map((x) => x.value),
          serviceDescription: document.getElementById('serviceDescription').value,
          serviceArea: document.getElementById('serviceArea').value,
          attachments,
        };
      }

      async function submitTo(url) {
        if (!uploaded || attachments.length < 2) {
          return alert('请先选择附件并点击“先上传附件”后再提交审核');
        }
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify(buildPayload()) });
        const data = await res.json();
        if(res.ok){alert(`${data.message}`); location.href = '/mini/provider-apply-status';}
        else{alert(data.detail||'提交失败');}
      }

      document.getElementById('form').addEventListener('submit', async (e) => { e.preventDefault(); submitTo('/api/provider/apply/submit'); });
      document.getElementById('resubmit').addEventListener('click', async () => submitTo('/api/provider/apply/resubmit'));
    </script>
  </body>
</html>
