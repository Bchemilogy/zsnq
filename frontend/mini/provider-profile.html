<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>我的入驻资料</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>我的入驻资料</div><h1>我的入驻资料</h1><p><a href='/mini/provider-home'>返回工作台</a></p><div id='box' class='card'></div><script>const t=localStorage.getItem('mini_token');fetch('/api/provider/apply/detail',{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(d=>{if(d.detail){box.textContent=d.detail;return;}const a=d.data||{};box.innerHTML=`<p>主体名称：${a.providerName}</p><p>联系人：${a.contactName}</p><p>联系电话：${a.contactPhone}</p><p>服务类型：${(a.serviceTypes||[]).map(x=>({AGRICULTURAL_MACHINERY:'农机服务',SEEDLING:'育秧服务',DRYING:'烘干服务',STORAGE:'仓储服务',PLANTING_GUIDE:'种植指导',OTHER:'其他服务'})[x]||x).join('、')}</p><p>服务区域：${a.serviceArea||''}</p><p>说明：${a.serviceDescription||''}</p><h3>附件</h3><ul>${(a.attachments||[]).map(f=>`<li><a target='_blank' href='${f.fileUrl}'>${f.fileName||f.fileType}</a></li>`).join('')||'<li>无</li>'}</ul>`});</script></body></html>
