<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>上传服务记录</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>上传服务记录</div><h1>服务记录提交</h1><p><a href='/mini/provider-demand-list'>返回需求列表</a></p><p id='msg'></p><div class='card'><p>请填写以下凭证（可先占位，后续换真实上传地址）</p><div class='form-grid'><div><label>作业照片URL</label><input id='photoUrl' value='/api/file/download/demo'></div><div><label>合同URL</label><input id='contractUrl' value='/api/file/download/demo'></div><div><label>其他文件URL</label><input id='otherUrl' placeholder='可空'></div><div><label>服务说明</label><input id='desc' value='完成收割'></div></div></div><textarea id='payload' rows='12'></textarea><button id='submitBtn'>提交记录</button><script>const t=localStorage.getItem('mini_token');const demandId=new URLSearchParams(location.search).get('demandId')||'30001';function build(){return {demandId:Number(demandId),serviceType:'AGRICULTURAL_MACHINERY',serviceAddress:'某县某乡镇',processQuantity:48,unit:'亩',startTime:'2026-05-01 09:00:00',endTime:'2026-05-01 15:00:00',description:desc.value,evidences:[{evidenceType:'WORK_PHOTO',fileName:'作业照片.jpg',fileUrl:photoUrl.value},{evidenceType:'CONTRACT',fileName:'合同.pdf',fileUrl:contractUrl.value},...(otherUrl.value?[{evidenceType:'OTHER',fileName:'其他材料',fileUrl:otherUrl.value}]:[])]}}payload.value=JSON.stringify(build(),null,2);[photoUrl,contractUrl,otherUrl].forEach(x=>x.oninput=()=>payload.value=JSON.stringify(build(),null,2));submitBtn.onclick=async()=>{const r=await fetch('/api/provider/service-record/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:payload.value});const d=await r.json();msg.textContent=r.ok?`提交成功，记录ID：${d.data.recordId}`:(d.detail||'提交失败');};</script></body></html>
