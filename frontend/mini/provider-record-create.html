<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>上传服务记录</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>上传服务记录</div><h1>服务记录提交</h1><p><a href='/mini/provider-demand-list'>返回需求列表</a></p><p id='msg'></p><div class='card'><label>处理量</label><input id='qty' type='number' value='48'><label>单位</label><input id='unit' value='亩'><label>开始时间</label><input id='startTime' value='2026-05-01 09:00:00'><label>结束时间</label><input id='endTime' value='2026-05-01 15:00:00'><label>服务说明</label><input id='desc' value='完成收割'><hr/><label>上传作业照片（至少1张）</label><input id='photoFile' type='file' accept='.jpg,.jpeg,.png'><button id='uploadPhoto'>上传作业照片</button><label>上传合同（PDF或图片）</label><input id='contractFile' type='file' accept='.pdf,.jpg,.jpeg,.png'><button id='uploadContract'>上传合同</button><button id='submitBtn'>提交记录并完成需求</button></div><script>const t=localStorage.getItem('mini_token');const demandId=Number(new URLSearchParams(location.search).get('demandId')||0);let photoUrl='';let contractUrl='';async function upload(file,type){const fd=new FormData();fd.append('file',file);fd.append('fileType',type);const r=await fetch('/api/file/upload',{method:'POST',headers:{Authorization:`Bearer ${t}`},body:fd});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{throw new Error(text||'上传失败')}if(!r.ok)throw new Error(d.detail||'上传失败');return d.data.fileUrl;}uploadPhoto.onclick=async()=>{const f=photoFile.files[0];if(!f)return alert('请选择作业照片');photoUrl=await upload(f,(f.name.split('.').pop()||'jpg').toLowerCase());alert('作业照片上传成功');};uploadContract.onclick=async()=>{const f=contractFile.files[0];if(!f)return alert('请选择合同文件');contractUrl=await upload(f,(f.name.split('.').pop()||'pdf').toLowerCase());alert('合同上传成功');};submitBtn.onclick=async()=>{if(!photoUrl)return alert('请先上传至少1张作业照片');if(!contractUrl)return alert('请先上传合同');const body={demandId,serviceType:'AGRICULTURAL_MACHINERY',serviceAddress:'某县某乡镇',processQuantity:Number(qty.value||0),unit:unit.value,startTime:startTime.value,endTime:endTime.value,description:desc.value,evidences:[{evidenceType:'WORK_PHOTO',fileName:'作业照片',fileUrl:photoUrl},{evidenceType:'CONTRACT',fileName:'合同文件',fileUrl:contractUrl}]};const r=await fetch('/api/provider/service-record/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify(body)});const d=await r.json();if(r.ok){alert('提交成功，需求状态已更新为已完成');location.href='/mini/provider-demand-list';}else msg.textContent=d.detail||'提交失败';};</script></body></html>
