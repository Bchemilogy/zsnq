<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>上传服务记录</title><link rel='stylesheet' href='/theme.css'></head><body><div class='banner'>上传服务记录</div><h1>服务记录提交</h1><p><a href='/mini/provider-demand-list'>返回需求列表</a></p><p id='msg'></p><textarea id='payload' rows='14'></textarea><button id='submitBtn'>提交记录</button><script>const t=localStorage.getItem('mini_token');if(!t)location.href='/mini/login';const demandId=new URLSearchParams(location.search).get('demandId')||'30001';payload.value=JSON.stringify({demandId:Number(demandId),serviceType:'AGRICULTURAL_MACHINERY',serviceAddress:'某县某乡镇',processQuantity:48,unit:'亩',startTime:'2026-05-01 09:00:00',endTime:'2026-05-01 15:00:00',description:'完成收割',evidences:[{evidenceType:'WORK_PHOTO',fileName:'作业照片.jpg',fileUrl:'/api/file/download/demo'},{evidenceType:'CONTRACT',fileName:'合同.pdf',fileUrl:'/api/file/download/demo'}]},null,2);submitBtn.onclick=async()=>{const r=await fetch('/api/provider/service-record/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:payload.value});const d=await r.json();msg.textContent=r.ok?`提交成功，记录ID：${d.data.recordId}`:(d.detail||'提交失败');};</script></body></html>
